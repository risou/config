# Mac OS X の clipboard とtmux の clipboard を同期
set -s set-clipboard on
bind-key -T copy-mode C-w send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode M-w send-keys -X copy-pipe-and-cancel "pbcopy"
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

bind-key C-w split-window -c '#{pane_current_path}' "tmux list-windows -F '#{window_index}: #{window_name}#{window_flags} (#{window_panes} panes) #{pane_current_path} #{?window_active, (active),}' | peco --initial-index $(tmux lsw | awk '/active.$/ {print NR-1}') | cut -d':' -f 1 | xargs tmux select-window -t"

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

## Tmux style and status
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'catppuccin/tmux#v2.1.3'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=default,fg=#{@thm_green},bold]  #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none,bold]│"
set -ga status-left "#[bg=default,fg=#{@thm_maroon},bold]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none,bold]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue},bold]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none,bold]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow},bold]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_green},bold] 󰍛 #{cpu_percentage} "
# set -ga status-right "#[bg=default,fg=#{@thm_blue},bold]  #($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -i 2 -m 2 | awk \'{print substr($1, 1, 2)}\')%% "
set -ga status-right "#[bg=default,fg=#{@thm_blue},bold]  #(tmux-mem-cpu-load -i 2 -m 2 | awk \'{print substr($1, 1, 5)}\')%% "
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0}, none,bold]│"
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=defualt,bold]},#{#[bg=default,fg=#{@thm_pink},bold]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0}, none,bold]│"
set -ga status-right "#[bg=default,fg=#{@thm_blue},bold] 󰭦 %Y-%m-%d 󰅐 %H:%M "


set -g status-position top
set -g status-style "bg=default"
set -g status-justify "absolute-centre"
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=default,fg=#{@thm_surface_0}"
setw -g pane-border-lines single
setw -g pane-border-status top

set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default,fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

## Tmux session store
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set-hook -g session-closed 'run-shell "~/.tmux-resurrect-sync.sh"'

## others

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'

run '~/.tmux/plugins/tpm/tpm'
